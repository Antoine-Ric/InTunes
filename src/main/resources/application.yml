spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/intunes
    username: intunes
    password: intunes
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

intunes:
  spotify:
    # Register an app at https://developer.spotify.com/dashboard, then export:
    #   export SPOTIFY_CLIENT_ID=... SPOTIFY_CLIENT_SECRET=...
    # Used for: track metadata, album art, popularity, release dates (client-credentials flow).
    # NOTE: audio-features and 30s previews are dead for new apps (killed Nov 2024).
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
  itunes:
    # No key needed. https://itunes.apple.com/search?term=...&entity=song -> previewUrl
    # Used for: 30-second song previews in the matchup arena.
    base-url: https://itunes.apple.com
  lastfm:
    # Register an API account at https://www.last.fm/api/account/create, then export:
    #   export LASTFM_API_KEY=... LASTFM_SHARED_SECRET=...
    # Used for: genre tag charts to draft seed lists (tag.gettoptracks).
    # Only the API key is needed for read-only calls.
    api-key: ${LASTFM_API_KEY:}
    shared-secret: ${LASTFM_SHARED_SECRET:}
    base-url: https://ws.audioscrobbler.com/2.0/
  matchup:
    rounds-per-genre: 16
    elo-k-factor: 32
    elo-start-rating: 1500.0

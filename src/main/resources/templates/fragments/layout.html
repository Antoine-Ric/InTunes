<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- Shared <head>: design-system CSS, Archivo font, page title. -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title th:text="${title} + ' · InTunes'">InTunes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,650;0,800;0,900;1,700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Top nav. Pass the active page key: home | genres | arena | profile | community | explore -->
<div th:fragment="topnav(active)" class="app-top">
  <a class="wordmark" th:href="@{/}"><span class="disc"></span>InTunes</a>
  <nav class="app-nav" aria-label="Primary">
    <a th:href="@{/}" th:classappend="${active == 'home'} ? ' active' : ''">Home</a>
    <a th:href="@{/genres}" th:classappend="${active == 'genres'} ? ' active' : ''">Genres</a>
    <a th:href="@{/matchup(genre='hiphop')}" th:classappend="${active == 'arena'} ? ' active' : ''">Arena</a>
    <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? ' active' : ''">My Profile</a>
    <a th:href="@{/community/hiphop_deep_90s}" th:classappend="${active == 'community'} ? ' active' : ''">Community</a>
    <a th:href="@{/explore}" th:classappend="${active == 'explore'} ? ' active' : ''">Explore</a>
  </nav>
  <span class="avatar-dot" title="Signed in as Ricardi">R</span>
</div>

<!-- Footer + global toast (needs app.js). -->
<div th:fragment="footer">
  <footer class="app-foot">
    <span class="wordmark small"><span class="disc"></span>InTunes</span>
    <span>Find your sound. Find your people.</span>
  </footer>
  <div class="toast" id="toast" role="status"></div>
</div>

<!-- Genre card. Used by genres.html for demo cards and for the live ${genres} loop.
     Expected live shape per item: key, name, blurb, swatch (css class), meta, status. -->
<a th:fragment="genreCard(key, name, blurb, swatch, meta, status)" class="genre-card"
   th:href="@{/matchup(genre=${key})}">
  <div class="swatch" th:classappend="${swatch}"></div>
  <h3 th:text="${name}">Genre</h3>
  <p th:text="${blurb}">Blurb</p>
  <div class="meta"><span th:text="${meta}">25 songs · 16 rounds</span><b th:text="${status}">Not started</b></div>
</a>

<!-- Explore community card. Used by explore.html for demo cards and the live ${communities} loop.
     Expected live shape per item: key, genreKey, genreTag, name, blurb, members, swatch, ctaLabel, ctaGhost. -->
<div th:fragment="commCard(key, genreKey, genreTag, name, blurb, members, swatch, ctaLabel, ctaGhost)"
     class="comm-card" th:attr="data-genre=${genreKey}">
  <div class="swatch" th:classappend="${swatch}"></div>
  <span class="genre-tag" th:text="${genreTag}">Genre</span>
  <h3 th:text="${name}">Community</h3>
  <p th:text="${blurb}">Blurb</p>
  <div class="foot">
    <span class="members" th:text="${members}">0 members</span>
    <a class="btn small" th:classappend="${ctaGhost} ? ' ghost' : ''"
       th:href="@{/community/{key}(key=${key})}" th:text="${ctaLabel}">Open board</a>
  </div>
</div>

</body>
</html>

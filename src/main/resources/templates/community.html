<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community — InTunes</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><nav><a href="/">InTunes</a> | <a href="/genres">Start</a> | <a href="/explore">Explore</a></nav></header>
<main>
    <!-- TODO: bind ${community}, ${posts} (paginated) -->
    <h1>Boom Bap Archaeologists</h1><!-- th:text=${community.name} -->
    <p>1,024 members</p>
    <form><!-- hx-post /api/communities/{key}/posts -->
        <textarea name="body" placeholder="Drop a take..."></textarea>
        <button>Post</button>
    </form>
    <div class="posts">
        <article>
            <p>Post body</p><!-- th:each over ${posts} -->
            <button>Like</button>
            <button>Reply</button>
            <!-- replies nested; pin button on your own replies -->
        </article>
    </div>
</main>
</body>
</html>

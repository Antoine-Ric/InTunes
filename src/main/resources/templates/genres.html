<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Pick a genre')}"></head>
<body>
<div class="app">
  <div th:replace="~{fragments/layout :: topnav('genres')}"></div>

  <!-- Live data: PageController#genres should add "genres", a list of items with
       key, name, blurb, swatch (css class), meta, status fields. -->
  <main class="view on">
    <span class="kicker">Step 1 · Genre select</span>
    <h2 class="big">Pick a genre.<br>We bring <em>the songs.</em></h2>
    <p class="lede">Each genre is seeded with 25 songs spanning eras and popularity: underground staples next to chart-toppers. Your picks across that spread are what name your profile. Choosing a genre drops you straight into the arena.</p>
    <div class="genre-grid">
      <th:block th:if="${genres != null}" th:each="g : ${genres}">
        <div th:replace="~{fragments/layout :: genreCard(${g.key}, ${g.name}, ${g.blurb}, ${g.swatch}, ${g.meta}, ${g.status})}"></div>
      </th:block>
      <th:block th:if="${genres == null}">
        <div th:replace="~{fragments/layout :: genreCard('hiphop', 'Hip-Hop', 'Boom bap to trap, coast to coast. The deepest seed list in the app.', 'sw-hiphop', '25 songs · 16 rounds', 'Your profile ✓')}"></div>
        <div th:replace="~{fragments/layout :: genreCard('rnb', 'R&amp;B', 'Slow jams, 90s groups, and the new wave of alt R&amp;B.', 'sw-rnb', '25 songs · 16 rounds', '9 / 16 played')}"></div>
        <div th:replace="~{fragments/layout :: genreCard('pop', 'Pop', 'Hooks engineered in a lab. Which ones survive your bracket?', 'sw-pop', '25 songs · 16 rounds', 'Not started')}"></div>
        <div th:replace="~{fragments/layout :: genreCard('rock', 'Rock', 'Classic riffs against indie staples and 2000s alt anthems.', 'sw-rock', '25 songs · 16 rounds', 'Not started')}"></div>
        <div th:replace="~{fragments/layout :: genreCard('electronic', 'Electronic', 'House, techno, and festival-sized drops, head to head.', 'sw-electro', '25 songs · 16 rounds', 'Not started')}"></div>
      </th:block>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

services:
  postgres:
    image: postgres:16
    container_name: intunes-postgres
    environment:
      POSTGRES_DB: intunes
      POSTGRES_USER: intunes
      POSTGRES_PASSWORD: intunes
    ports:
      - "5432:5432"
    volumes:
      - intunes-pgdata:/var/lib/postgresql/data

volumes:
  intunes-pgdata:
